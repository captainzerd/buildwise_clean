name: wysebrix
description: "WyseBrix — Construction cost estimation and project management for Ghana"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  async: ^2.11.0
  path: ^1.9.0

  # 3rd‑party
  provider: ^6.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  pdf: ^3.11.1
  printing: ^5.12.0
  http: ^1.2.2
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  app_links: ^6.4.1
  webview_flutter: ^4.10.0   # Sprint 16 — Paystack checkout
  signature: ^5.3.0          # Sprint 20 — e-signing
  csv: ^6.0.0                # Sprint 19 — BoQ CSV export
  geolocator: ^13.0.2        # GPS-tagged site photos
  flutter_image_compress: ^2.3.0  # Photo compression before upload

  # Firebase (you’re using these in iOS pods)
  firebase_crashlytics: ^4.1.3
  firebase_core: ^3.15.2
  firebase_analytics: ^11.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.3
  firebase_storage: ^12.3.3
  cloud_functions: ^5.1.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.1
  firebase_app_check: ^0.3.2
  fl_chart: ^0.70.0
  go_router: ^14.6.2
  get_it: ^8.0.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_sign_in: ^6.2.1
  flutter_stripe: ^11.0.0      # Stripe card / Apple Pay / Google Pay
  pin_code_fields: ^8.0.1     # 6-box OTP input
  sentry_flutter: ^8.0.0
  permission_handler: ^11.0.0
  package_info_plus: ^8.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.9
  fake_cloud_firestore: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/data/cost_catalog_gh.json
    - assets/data/ghana_locations.json
    - assets/images/
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  # Android adaptive icon (API 26+) — foreground image on a white circle background.
  # Change the background colour below to match your brand.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false