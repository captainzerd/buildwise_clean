name: Deploy Cloud Functions

on:
  push:
    branches: [main, mvp-vendors-projects]
    paths:
      - 'functions/src/**'
      - 'functions/package.json'
      - 'functions/package-lock.json'

jobs:
  deploy-functions-staging:
    name: Deploy Functions → Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/mvp-vendors-projects'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build TypeScript
        run: npm run build
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Cloud Functions to Staging
        run: |
          firebase deploy --only functions \
            --project wysebrix-staging \
            --token "${{ secrets.FIREBASE_TOKEN_STAGING }}" \
            --non-interactive

  deploy-functions-prod:
    name: Deploy Functions → Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Build TypeScript
        run: npm run build
        working-directory: functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Cloud Functions to Production
        run: |
          firebase deploy --only functions \
            --project building-estimator \
            --token "${{ secrets.FIREBASE_TOKEN_PROD }}" \
            --non-interactive
