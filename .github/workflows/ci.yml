name: CI

on:
  push:
    branches: [main, mvp-vendors-projects]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (no fatal infos)
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  build-android-staging:
    name: Build Android (staging)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/mvp-vendors-projects'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write google-services.json (staging)
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON_STAGING }}' > android/app/google-services.json

      - name: Build debug APK (staging env)
        run: |
          flutter build apk --debug \
            --dart-define=ENV=staging \
            "--dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}"

      - name: Upload staging APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wysebrix-staging-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-android-prod:
    name: Build Android (production)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write google-services.json (prod)
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON_PROD }}' > android/app/google-services.json

      - name: Build release APK (prod env)
        run: |
          flutter build apk --release \
            --dart-define=ENV=prod \
            "--dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}" \
            "--dart-define=PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY_LIVE }}" \
            "--dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY_LIVE }}"

      - name: Upload prod APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wysebrix-prod-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  test-rules:
    name: Firestore Rules Tests
    runs-on: ubuntu-latest
    needs: []   # runs in parallel with analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install functions deps
        run: npm ci
        working-directory: functions
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Run rules tests via emulators
        run: |
          firebase emulators:exec \
            --only auth,firestore \
            --project wysebrix-test \
            "npm run test:rules --prefix functions"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  test-functions:
    name: Cloud Functions Unit Tests
    runs-on: ubuntu-latest
    needs: []   # runs in parallel with analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install functions deps
        run: npm ci
        working-directory: functions
      - name: Run Cloud Functions unit tests
        run: npm run test:unit
        working-directory: functions
