name: Build iOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-pr:
    name: Build iOS (staging, unsigned)
    runs-on: macos-14
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write GoogleService-Info.plist (staging)
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_PLIST_STAGING }}' > ios/Runner/GoogleService-Info.plist

      - name: Build iOS (no codesign, staging)
        run: |
          flutter build ios --no-codesign \
            --dart-define=ENV=staging \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

  build-ios-prod:
    name: Build iOS (production, signed → TestFlight)
    runs-on: macos-14
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      XCODE_VERSION: '15.4'  # Pinned: xcrun altool removed in Xcode 16

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s "/Applications/Xcode_${{ env.XCODE_VERSION }}.app"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Write GoogleService-Info.plist (prod)
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_PLIST_PROD }}' > ios/Runner/GoogleService-Info.plist

      - name: Import Apple Distribution Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" build.keychain

      - name: Clean up certificate file
        if: always()
        run: rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/wysebrix.mobileprovision

      - name: Substitute Team ID in ExportOptions.plist
        run: |
          sed -i '' "s/\$(APPLE_TEAM_ID)/${{ secrets.APPLE_TEAM_ID }}/g" ios/ExportOptions.plist

      - name: Build IPA (prod)
        run: |
          flutter build ipa \
            --dart-define=ENV=prod \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY_LIVE }} \
            --dart-define=STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY_LIVE }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        # xcrun altool is deprecated since Xcode 14 and removed in Xcode 16.
        # Using xcrun altool with pinned Xcode 15.4 above. Alternative: fastlane pilot.
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun altool --upload-app \
            --type ios \
            --file build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --apiKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            --verbose

      - name: Clean up API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: wysebrix-ios-prod-${{ github.sha }}
          path: build/ios/ipa/*.ipa
          retention-days: 30
