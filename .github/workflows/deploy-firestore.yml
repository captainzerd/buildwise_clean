name: Deploy Firestore Rules & Indexes

on:
  push:
    branches: [main, mvp-vendors-projects]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json

# NOTE: These deploy workflows trigger independently of ci.yml. Deploys are not gated
# on CI passing. Ensure the CI workflow passes before relying on a deploy for production use.

jobs:
  deploy-firestore-staging:
    name: Deploy Firestore → Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/mvp-vendors-projects'

    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules and indexes to Staging
        run: |
          firebase deploy --only firestore \
            --project wysebrix-staging \
            --token "${{ secrets.FIREBASE_TOKEN_STAGING }}" \
            --non-interactive

  deploy-firestore-prod:
    name: Deploy Firestore → Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules and indexes to Production
        run: |
          firebase deploy --only firestore \
            --project building-estimator \
            --token "${{ secrets.FIREBASE_TOKEN_PROD }}" \
            --non-interactive
